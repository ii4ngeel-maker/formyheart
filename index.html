<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Te amo Fersita :3</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Libre+Baskerville&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Playfair Display', serif;
  background: #111;
  color: #ddd;
  overflow-x: hidden;
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}
header {
  text-align: center;
  padding: 40px 20px;
  margin-top: 60px;
}
header h1 {
  font-size: 2.5em;
  color: #f48fb1; 
  margin-bottom: 10px;
}
header p {
  font-size: 1.2em;
  color: #faa2c1; 
}
.section-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1; 
  margin-top: 40px; 
}
.sobre {
  background: #222;
  border: 2px solid #f48fb1;
  border-radius: 20px;
  padding: 30px 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  transform: scaleY(0);
  transform-origin: top;
  transition: transform 0.8s ease;
  margin: 20px auto;
  max-width: 800px;
  position: relative;
  z-index: 5;
}
.sobre.abierto {
  transform: scaleY(1);
}
.carta h2 {
  color: #f06292; 
  margin-bottom: 15px;
}
.carta p {
  font-family: 'Libre Baskerville', serif;
  font-size: 16px;
  line-height: 1.8;
  color: #eee;
}
.carta img {
  max-width: 100%;
  border-radius: 12px;
  margin-bottom: 15px;
  display: block;
  margin-left: auto;
  margin-right: auto;
}
button {
  margin-top: 20px;
  padding: 12px 25px;
  background: #f48fb1; 
  color: #111;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
  transition: background 0.3s ease;
}
button:hover { background-color: #f06292; }
.modal {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
}
.modal-content {
  background: #2c2c2c;
  padding: 25px;
  border-radius: 12px;
  max-width: 90%;
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  text-align: center;
  border: 1px solid #f48fb1; 
}
.modal-content h3 {
  margin-bottom: 15px;
  color: #f48fb1; 
}
#respuestaInput {
  margin-top: 15px;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #f48fb1; 
  width: 80%;
  background: #333;
  color: #eee;
}
footer {
  text-align: center;
  padding: 20px;
  color: #faa2c1;
}
.brillo, .hoja, .estrella {
  pointer-events: none;
  position: fixed;
}
.brillo {
  width: 6px; height: 6px;
  background: rgba(244,143,177,0.8); 
  border-radius: 50%;
  animation: parpadeo 3s ease-in-out infinite;
  z-index: 1;
}
.hoja {
  width: 20px; height: 20px;
  background: linear-gradient(45deg, #f06292, #f48fb1); 
  border-radius: 50% 50% 0 50%;
  transform: rotate(45deg);
  animation: caer 8s linear infinite;
  z-index: 1;
}
.estrella {
  width: 2px; height: 2px;
  background: #fff;
  border-radius: 50%;
  animation: moverEstrella 8s linear infinite;
  z-index: 0;
}
@keyframes caer { 0%{transform:translateY(-10%) rotate(0deg);opacity:0;} 10%{opacity:1;} 100%{transform:translateY(110vh) rotate(360deg);opacity:0;} }
@keyframes parpadeo { 0%,100%{opacity:0.8;} 50%{opacity:0.2;} }
@keyframes moverEstrella {0%{transform:translate(0,0);opacity:1;}100%{transform:translate(50vw,100vh);opacity:0;}}

</style>
</head>
<body>
<script>
  document.title = "Te amo mucho Fersita :3";
</script>

<header>
<h1> ola mi loba auuu </h1>
<p>"Ya un mesecito yujuuu :D"</p>
</header>

<section class="section-center">
  <button id="btnAbrir">Abrir carta</button>
</section>

<div class="sobre" id="sobre">
  <div class="carta">
  <h2>Hola, mi niña preciosa c:</h2>
  <img src="foto1.jpg.jpeg" alt="Foto 1" style="width: 100%; max-width: 400px; margin-bottom: 10px; border-radius: 12px;">
  <img src="foto2.jpg.jpeg" alt="Foto 2" style="width: 100%; max-width: 400px; margin-bottom: 10px; border-radius: 12px;">
  <img src="foto3.jpg.jpeg" alt="Foto 3" style="width: 100%; max-width: 400px; margin-bottom: 20px; border-radius: 12px;">
  <p id="textoCarta"></p>
</div>


</div>

<div class="modal" id="modalPregunta" style="display: none;">
<div class="modal-content">
  <h3 id="pregunta">Ingresa contraseña</h3>
  <input type="text" id="respuestaInput" placeholder="Escribe tu contraseña aquí">
  <button id="btnEnviar">Enviar</button>
</div>
</div>

<footer>
<p><strong>Contraseña:</strong> t ama tu nobio robloxiano</p>
<p>Espero te guste. Con mucho amor, cardielo hermoso guapo beyo ♡ </p>
</footer>

<script>
const contraseñaCorrecta = "t ama tu nobio robloxiano";

const modal = document.getElementById('modalPregunta');
const btnAbrir = document.getElementById('btnAbrir');
const input = document.getElementById('respuestaInput');
const btnEnviar = document.getElementById('btnEnviar');

btnAbrir.addEventListener('click', () => {
  btnAbrir.disabled = true;
  btnAbrir.style.cursor = "not-allowed";
  btnAbrir.style.opacity = 0.6;
  modal.style.display = 'flex';
});

btnEnviar.addEventListener('click', verificarContraseña);

function verificarContraseña(){
  const respuesta = input.value.trim();
  if(respuesta === contraseñaCorrecta){
    modal.style.display = 'none';
    abrirCarta();
  } else {
    alert("Contraseña incorrecta 💔");
  }
}

const textoOriginal = `
O sea… no sé ni cómo empezar esto, porque un mes sin verte se siente como si alguien hubiera quitado una parte importante de mi día. Sí, esa parte que hace que todo sea más más divertido… y esa parte eres tú.
Un mes suena corto, pero la neta cada día se ha sentido largo. Me despierto pensando en ti, en cómo estarás, en lo que harás, en lo que se te pasó por la cabeza. Me voy a dormir pensando en ti otra vez, y a veces me pongo a imaginar cómo sería verte de repente, como si todo el mes se juntara en un solo abrazo gigante.
Extraño tus gestos, extraño tu risa, q m hace sonreír solo de pensarla, extraño la forma en que hablas de cosas que te importan, cómo te emocionas aunque yo no esté ahí para verlo, y aún así siento esa emoción desde aquí, me gusta mucho escucharte aunque a veces extraño hasta esos silencios cómodos que solo se sienten bien cuando estoy contigo.
Y sí, a veces me pongo cursi. Lo sé. Pero no puedo evitarlo, porque todo esto que siento por ti es real. Me hace pensar en un millón de cosas tontas y lindas a la vez. Pienso en cómo quiero que te sientas segura, querida, importante… y que aunque no nos veamos, siempre sientas que estoy aquí, pensando en ti y queriéndote cada día un poco más y si, yo se, KJASKAK, yo se que a veces se me olvida incluso decirte buenasnoches pero no te lo tomes a mal, créeme de verdad que caigo dormido como bebe a tal punto de que nada me despierta, para nada quiero que pienses que te estoy ignorando ;(.
Un mes. Y aunque suene corto, me doy cuenta de que es mucho para lo que he llegado a sentir. Porque contigo todo se siente más intenso, más verdadero, más bonito. Porque contigo cada pensamiento, cada emoción, cada recuerdo que imagino se siente más grande de lo que jamás pensé que podría sentir por alguien.
Me encanta imaginar cómo será el próximo mes, y el siguiente, y todos los que vengan. Quiero seguir conociéndote, quiero seguir compartiendo cada detalle de mi vida y quiero que tú compartas los tuyos. Quiero que nos la pesemos riéndonos de cosas tontas, hablar de cosas importantes y simplemente estar juntos aunque no tengamos un plan, aunque no pase nada “especial”, porque lo especial ya es estar contigo.
Gracias por llegar a mi vida y hacer que todo sea más fácil, más tranquilo, más divertido… aunque estemos lejos. Gracias por hacer que pensar en ti sea lo más bonito de mi día, y por hacerme sentir que no estoy solo. Gracias por ser tú, por existir, y quiero que sepas que bao cualquier circunstancia nada cambia lo que siento por ti.
Te pienso, te extraño y te quiero muchísimo. Más de lo que cualquier carta pueda explicar. Y sí, también me pongo dramático a veces, porque un mes contigo estando igual de enamorado que el principio me hace darme cuenta de cuánto vales para mí.
Así que sí… un mes y contando. Y espero que sean muchos más, llenos de momentos que no hemos vivido todavía, pero que sé que serán increíbles porque los compartiremos juntos.

Te extraño, Fer. De menos infinito hasta infinito, y más allá de todo lo que podamos imaginar.


 `;

function abrirCarta(){
  document.getElementById('sobre').classList.add('abierto');
  escribirCarta();
  iniciarDecoraciones();
}

function escribirCarta(){
  const carta = document.getElementById('textoCarta');
  carta.innerHTML = '';
  let i = 0;
  function escribir() {
    if (i < textoOriginal.length){
      const char = textoOriginal[i];
      if(char === '\n'){
        carta.innerHTML += '<br>';
      } else {
        carta.innerHTML += char;
      }
      i++;
      setTimeout(escribir, 30);
    }
  }
  escribir();
}

function iniciarDecoraciones(){
  for(let i=0;i<30;i++){
    const hoja=document.createElement('div'); hoja.classList.add('hoja');
    hoja.style.left=Math.random()*100+"vw";
    hoja.style.animationDelay=(Math.random()*5)+"s";
    document.body.appendChild(hoja);
    setTimeout(()=>hoja.remove(),20000);
  }
  for(let i=0;i<50;i++){
    const brillo=document.createElement('div'); brillo.classList.add('brillo');
    brillo.style.left=Math.random()*100+"vw";
    brillo.style.top=Math.random()*100+"vh";
    brillo.style.animationDelay=(Math.random()*5)+"s";
    brillo.style.animationDuration=(3 + Math.random()*4)+"s";
    document.body.appendChild(brillo);
    setTimeout(()=>brillo.remove(),15000);
  }
  for(let i=0;i<60;i++){
    const estrella=document.createElement('div'); estrella.classList.add('estrella');
    estrella.style.left=Math.random()*100+"vw";
    estrella.style.top=Math.random()*100+"vh";
    estrella.style.animationDelay=(Math.random()*5)+"s";
    estrella.style.animationDuration=(5 + Math.random()*5)+"s";
    document.body.appendChild(estrella);
    setTimeout(()=>estrella.remove(),20000);
  }
}
</script>
</body>
</html>
