<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Te amo Fersita :3</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Libre+Baskerville&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Playfair Display', serif;
  background: #111;
  color: #ddd;
  overflow-x: hidden;
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}
header {
  text-align: center;
  padding: 40px 20px;
  margin-top: 60px;
}
header h1 {
  font-size: 2.5em;
  color: #f48fb1; 
  margin-bottom: 10px;
}
header p {
  font-size: 1.2em;
  color: #faa2c1; 
}
.section-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1; 
  margin-top: 40px; 
}
.sobre {
  background: #222;
  border: 2px solid #f48fb1;
  border-radius: 20px;
  padding: 30px 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  transform: scaleY(0);
  transform-origin: top;
  transition: transform 0.8s ease;
  margin: 20px auto;
  max-width: 800px;
  position: relative;
  z-index: 5;
}
.sobre.abierto {
  transform: scaleY(1);
}
.carta h2 {
  color: #f06292; 
  margin-bottom: 15px;
}
.carta p {
  font-family: 'Libre Baskerville', serif;
  font-size: 16px;
  line-height: 1.8;
  color: #eee;
}
.carta img {
  max-width: 100%;
  border-radius: 12px;
  margin-bottom: 15px;
  display: block;
  margin-left: auto;
  margin-right: auto;
}
button {
  margin-top: 20px;
  padding: 12px 25px;
  background: #f48fb1; 
  color: #111;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
  transition: background 0.3s ease;
}
button:hover { background-color: #f06292; }
.modal {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
}
.modal-content {
  background: #2c2c2c;
  padding: 25px;
  border-radius: 12px;
  max-width: 90%;
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  text-align: center;
  border: 1px solid #f48fb1; 
}
.modal-content h3 {
  margin-bottom: 15px;
  color: #f48fb1; 
}
#respuestaInput {
  margin-top: 15px;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #f48fb1; 
  width: 80%;
  background: #333;
  color: #eee;
}
footer {
  text-align: center;
  padding: 20px;
  color: #faa2c1;
}
.brillo, .hoja, .estrella {
  pointer-events: none;
  position: fixed;
}
.brillo {
  width: 6px; height: 6px;
  background: rgba(244,143,177,0.8); 
  border-radius: 50%;
  animation: parpadeo 3s ease-in-out infinite;
  z-index: 1;
}
.hoja {
  width: 20px; height: 20px;
  background: linear-gradient(45deg, #f06292, #f48fb1); 
  border-radius: 50% 50% 0 50%;
  transform: rotate(45deg);
  animation: caer 8s linear infinite;
  z-index: 1;
}
.estrella {
  width: 2px; height: 2px;
  background: #fff;
  border-radius: 50%;
  animation: moverEstrella 8s linear infinite;
  z-index: 0;
}
@keyframes caer { 0%{transform:translateY(-10%) rotate(0deg);opacity:0;} 10%{opacity:1;} 100%{transform:translateY(110vh) rotate(360deg);opacity:0;} }
@keyframes parpadeo { 0%,100%{opacity:0.8;} 50%{opacity:0.2;} }
@keyframes moverEstrella {0%{transform:translate(0,0);opacity:1;}100%{transform:translate(50vw,100vh);opacity:0;}}

</style>
</head>
<body>
<script>
  document.title = "Te amo mucho Fersita :3";
</script>

<header>
<h1> ola mi loba auuu </h1>
<p>"Ya un mesecito yujuuu :D"</p>
</header>

<section class="section-center">
  <button id="btnAbrir">Abrir carta</button>
</section>

<div class="sobre" id="sobre">
  <div class="carta">
  <h2>Hola, mi niña preciosa c:</h2>
  <img src="foto1.jpg.jpeg" alt="Foto 1" style="width: 100%; max-width: 400px; margin-bottom: 10px; border-radius: 12px;">
  <img src="foto2.jpg.jpeg" alt="Foto 2" style="width: 100%; max-width: 400px; margin-bottom: 10px; border-radius: 12px;">
  <img src="foto3.jpg.jpeg" alt="Foto 3" style="width: 100%; max-width: 400px; margin-bottom: 20px; border-radius: 12px;">
  <p id="textoCarta"></p>
</div>


</div>

<div class="modal" id="modalPregunta" style="display: none;">
<div class="modal-content">
  <h3 id="pregunta">Ingresa contraseña</h3>
  <input type="text" id="respuestaInput" placeholder="Escribe tu contraseña aquí">
  <button id="btnEnviar">Enviar</button>
</div>
</div>

<footer>
<p><strong>Contraseña:</strong> t ama tu nobio robloxiano</p>
<p>Espero te guste. Con mucho amor, cardielo hermoso guapo beyo ♡ </p>
</footer>

<script>
const contraseñaCorrecta = "t ama tu nobio robloxiano";

const modal = document.getElementById('modalPregunta');
const btnAbrir = document.getElementById('btnAbrir');
const input = document.getElementById('respuestaInput');
const btnEnviar = document.getElementById('btnEnviar');

btnAbrir.addEventListener('click', () => {
  btnAbrir.disabled = true;
  btnAbrir.style.cursor = "not-allowed";
  btnAbrir.style.opacity = 0.6;
  modal.style.display = 'flex';
});

btnEnviar.addEventListener('click', verificarContraseña);

function verificarContraseña(){
  const respuesta = input.value.trim();
  if(respuesta === contraseñaCorrecta){
    modal.style.display = 'none';
    abrirCarta();
  } else {
    alert("Contraseña incorrecta 💔");
  }
}

const textoOriginal = `
Hola mi niña, ya un mecesito y no sabes como te extraño tanto, cada segundo, cada minuto, cada hora, cada dia.
Quiero decirte que a lo largo de todo este tiempo me he dado cuenta de la increible niña que eres, sinn importar que a veces odies todo el mundo que aunque no lo demuestres, lo sientes, inlcuso a mi.
Un mes, ¿eh? Un mes sin verte, sin tus chistes malos, sin tus ojos café (que por cierto, me tienen mal), sin tus pláticas random de cosas que a veces ni entiendo, pero igual me quedo escuchando como si fuera la cosa más interesante del universo. Un mes sin todos esos momentos que siempre hacen que me ría, aunque a veces ni tengamos por qué reírnos.

Te extraño, y mucho. Como que me di cuenta que me paso el día pensando en ti, y no de esa forma en la que te dices “estoy pensando en ti” y luego ya se te olvida. No. Yo realmente me quedo con cosas de ti en la cabeza, todo el tiempo. Cosas chiquitas, como tu risa o las veces que dices algo súper casual y me quedo pensando “¿cómo rayos hace esa persona para ser tan genial?” o el hecho de que yo te diga algo que me importa, y tú me respondas con un meme que ni al caso, pero que me hace reír de todos modos.

Un mes sin verte y ya me estoy poniendo todo cursi. Pero no me arrepiento. Aunque lo diga como si fuera una exageración, es la neta: me haces falta. Y no me refiero solo a tus abrazos (que, por cierto, me deben) sino también a la forma en que todo se siente más normal, más tranquilo, más… fácil cuando estás cerca.

Sé que no hemos tenido chance de vernos, y créeme que me muero por verte. Pero mientras eso pasa, me paso el día pensando en ti, en lo que haces, en lo que no haces, y hasta en tus chismes de “no puedo vivir porque los martillazos en mi casa no me dejan descansar”. (Lo que se siente como drama, pero a mí me parece lo más tierno del mundo).

A veces me pongo a pensar que lo que más quiero ahora mismo es verte, aunque sea en una de esas videollamadas en las que nos quedamos más tiempo eligiendo qué hacer que hablando. Me pasa mucho que en medio de mi día, cuando todo está un poco caótico, me acuerdo de ti y es como si de repente todo estuviera un poquito más tranquilo, aunque no estemos ni cerca.

Sé que nos hemos visto poco, pero me encantaría más, ¿sabes? Quiero más momentos de los que nunca tienen sentido, de esos que ni siquiera podríamos contar como “esos son los mejores momentos”. Pero para mí sí lo serían, porque todo lo que comparto contigo es lo que me hace sentir bien. Así que… sí, a veces te extraño muchísimo, más de lo que quiero admitir, y a veces no sé cómo no he puesto un millón de emojis de "te extraño" en cada mensaje que te mando. 😂

Gracias por aparecer en mi vida de una forma tan tranquila, tan sencilla, pero tan importante. Y aunque no nos veamos tan seguido, me sigo sintiendo afortunado de poder pensar en ti, de tenerte en mi cabeza todo el día, aunque estemos en puntos diferentes del mundo.

Nos vemos pronto (ya quiero que sea YA).

Te extraño un chingo, de menos infinito hasta infinito.
 rfrfr
 `;

function abrirCarta(){
  document.getElementById('sobre').classList.add('abierto');
  escribirCarta();
  iniciarDecoraciones();
}

function escribirCarta(){
  const carta = document.getElementById('textoCarta');
  carta.innerHTML = '';
  let i = 0;
  function escribir() {
    if (i < textoOriginal.length){
      const char = textoOriginal[i];
      if(char === '\n'){
        carta.innerHTML += '<br>';
      } else {
        carta.innerHTML += char;
      }
      i++;
      setTimeout(escribir, 30);
    }
  }
  escribir();
}

function iniciarDecoraciones(){
  for(let i=0;i<30;i++){
    const hoja=document.createElement('div'); hoja.classList.add('hoja');
    hoja.style.left=Math.random()*100+"vw";
    hoja.style.animationDelay=(Math.random()*5)+"s";
    document.body.appendChild(hoja);
    setTimeout(()=>hoja.remove(),20000);
  }
  for(let i=0;i<50;i++){
    const brillo=document.createElement('div'); brillo.classList.add('brillo');
    brillo.style.left=Math.random()*100+"vw";
    brillo.style.top=Math.random()*100+"vh";
    brillo.style.animationDelay=(Math.random()*5)+"s";
    brillo.style.animationDuration=(3 + Math.random()*4)+"s";
    document.body.appendChild(brillo);
    setTimeout(()=>brillo.remove(),15000);
  }
  for(let i=0;i<60;i++){
    const estrella=document.createElement('div'); estrella.classList.add('estrella');
    estrella.style.left=Math.random()*100+"vw";
    estrella.style.top=Math.random()*100+"vh";
    estrella.style.animationDelay=(Math.random()*5)+"s";
    estrella.style.animationDuration=(5 + Math.random()*5)+"s";
    document.body.appendChild(estrella);
    setTimeout(()=>estrella.remove(),20000);
  }
}
</script>
</body>
</html>
